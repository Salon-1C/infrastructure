worker_processes 1;
events {}
http {
    server {
        listen 2375;

        location / {
            # Rewrite versioned Docker API paths to minimum supported by Docker 29.x.
            # Traefik v3.3 defaults to API version 1.24; Docker Engine 29.x requires >= 1.44.
            rewrite ^/v[0-9]+\.[0-9]+(/.*)$ /v1.44$1 break;

            proxy_pass         http://docker-socket-proxy:2375;
            proxy_buffering    off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_http_version 1.0;
            proxy_set_header   Connection close;
        }
    }
}
