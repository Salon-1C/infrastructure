# Overlay para escenarios Warm y Cold de replicación de blume_business_db.
# Uso: docker compose -f docker-compose.yml -f docker-compose.replication.yml --profile replication up -d
#
# Hot replication (3 réplicas de blume-business-logic-ms) ya está en docker-compose.yml base.

services:
  mysql:
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --sync-binlog=1
    volumes:
      - ./replication/mysql/init-primary:/docker-entrypoint-initdb.d:ro

  mysql-warm:
    image: mysql:8.4
    profiles: ["replication"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    command:
      - --server-id=2
      - --read-only=1
      - --relay-log=relay-bin
      - --skip-replica-start
    volumes:
      - mysql_warm_data:/var/lib/mysql
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - blume_data

volumes:
  mysql_warm_data:
